<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#14181f;--muted:#5b6472;--line:#e3e6eb;--accent:#0b7a4b;--h:#1f6feb;--d:#8b93a1;--a:#e8590c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--card:#171c23;--text:#eef1f5;--muted:#9aa3b2;--line:#272e38;--accent:#3ddc97;--h:#5b9dff;--d:#7b8494;--a:#ff8a4c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1318;--card:#171c23;--text:#eef1f5;--muted:#9aa3b2;--line:#272e38;--accent:#3ddc97;--h:#5b9dff;--d:#7b8494;--a:#ff8a4c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.brand{font-size:1.4rem;font-weight:800}.brand span{color:var(--accent)}
.sub{color:var(--muted);font-size:.85rem;margin:2px 0 14px}
.tabs,.ctl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tab,.chip{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;cursor:pointer}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.chip.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.note{margin:6px 0 14px;padding:10px 14px;border:1px dashed var(--line);border-radius:10px;font-size:.82rem;color:var(--muted)}
h2{font-size:.95rem;margin:18px 0 8px;color:var(--muted);text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.meta{font-size:.78rem;color:var(--muted)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:10px 0 8px}
.tm{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-weight:700;font-size:.92rem}
.bd{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:800;color:#fff}
.x{color:var(--muted);font-size:.8rem}
.pc{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;font-weight:800;font-size:1.2rem}
.pc small{display:block;font-weight:400;font-size:.7rem;color:var(--muted)}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:8px 0;background:var(--line)}
.bar i{display:block;width:0;transition:width .8s ease}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips span{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.more{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:4px 0}
.det{display:none;border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-size:.86rem}.det.open{display:block}
.det h4{margin:10px 0 4px;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.mini{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:2px 0 4px}.mini i{display:block;height:100%;background:var(--accent)}

body{background:var(--bg) repeating-linear-gradient(90deg,transparent 0 60px,rgba(11,122,75,.05) 60px 120px)}
.hero{position:relative;overflow:hidden;border-radius:16px;padding:18px 18px 16px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#0b6b43,#0f9d58)}
.hero svg.pitch{position:absolute;inset:0;width:100%;height:100%;opacity:.28}
.hero>*{position:relative}
.logo{display:flex;align-items:center;gap:10px}.logo svg{width:44px;height:44px;flex:none}
.hero .brand{font-size:1.5rem;font-weight:800;color:#fff}.hero .brand span{color:#d7ffe9}
.hero .sub{color:#e6fff2;margin:6px 0 0}
.card{border-top:3px solid var(--accent)}
.bd{position:relative;overflow:hidden;width:46px;height:46px}
.bd img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:4px;border-radius:50%}
h2{display:flex;align-items:center;gap:8px}h2::before{content:"";width:18px;height:2px;background:var(--accent);border-radius:2px}
</style>
</head>

const fmtH=d=>new Date(d).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit",timeZone:"America/Argentina/Buenos_Aires"});
const dayKey=d=>new Date(d).toLocaleDateString("en-CA",{timeZone:"America/Argentina/Buenos_Aires"});
const dec=x=>String(x).replace(".",",");
function card(m){
  const p=m.prob,id=m.id||m.local+m.visitante;
  const badge=(n,u)=>`<div class="bd" style="background:${hue(n)}">${ini(n)}${u?`<img src="${u}" alt="" loading="lazy" onerror="this.remove()">`:""}</div>`;
  return `<div class="card"><div class="meta">${fmtH(m.fecha_utc)} h (Argentina)</div>
  <div class="vs"><div class="tm">${badge(m.local,m.escudo_local)}${m.local}</div><div class="x">vs</div><div class="tm">${badge(m.visitante,m.escudo_visitante)}${m.visitante}</div></div>
  <div class="pc"><div style="color:var(--h)">${p.local}%<small>Local</small></div><div style="color:var(--d)">${p.empate}%<small>Empate</small></div><div style="color:var(--a)">${p.visitante}%<small>Visitante</small></div></div>
  <div class="bar"><i data-w="${p.local}" style="background:var(--h)"></i><i data-w="${p.empate}" style="background:var(--d)"></i><i data-w="${p.visitante}" style="background:var(--a)"></i></div>
  <div class="chips"><span>+2,5 goles: ${p.mas_2_5}%</span><span>Ambos marcan: ${p.ambos_marcan}%</span></div>
  <button class="more" data-id="${id}">${open[id]?"Ocultar detalle ▴":"Ver detalle ▾"}</button>
  <div class="det ${open[id]?"open":""}"><h4>Marcadores más probables</h4>${p.marcadores.map(s=>`<div class="row"><span>${s.resultado}</span><b>${dec(s.prob)}%</b></div><div class="mini"><i style="width:${Math.min(100,s.prob*5)}%"></i></div>`).join("")}
  <h4>Goles esperados</h4><div class="row"><span>${m.local}</span><b>${dec(p.goles_esperados.local)}</b></div><div class="row"><span>${m.visitante}</span><b>${dec(p.goles_esperados.visitante)}</b></div></div></div>`;
}
function render(){
  document.getElementById("tabs").innerHTML=DATA.ligas.map((l,i)=>`<button class="tab ${i==lg?"on":""}" data-i="${i}">${l.nombre}</button>`).join("");
  document.getElementById("upd").textContent="Última actualización del bot: "+new Date(DATA.actualizado).toLocaleString("es-AR",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit",timeZone:"America/Argentina/Buenos_Aires"});
  const L=DATA.ligas[lg],g={};
  L.partidos.forEach(m=>(g[dayKey(m.fecha_utc)]=g[dayKey(m.fecha_utc)]||[]).push(m));
  const out=document.getElementById("out");
  out.innerHTML=Object.keys(g).sort().map(k=>{
    let ms=g[k];if(sortFav)ms=[...ms].sort((a,b)=>Math.max(b.prob.local,b.prob.visitante)-Math.max(a.prob.local,a.prob.visitante));
    return `<h2>${fmtD(ms[0].fecha_utc)}</h2><div class="grid">${ms.map(card).join("")}</div>`}).join("")||'<div class="note">No hay partidos próximos.</div>';
  requestAnimationFrame(()=>requestAnimationFrame(()=>out.querySelectorAll(".bar i").forEach(e=>e.style.width=e.dataset.w+"%")));
}
document.getElementById("tabs").onclick=e=>{const b=e.target.closest(".tab");if(b){lg=+b.dataset.i;render()}};
document.getElementById("srt").onclick=e=>{sortFav=!sortFav;e.target.classList.toggle("on",sortFav);render()};
document.getElementById("out").onclick=e=>{const b=e.target.closest(".more");if(!b)return;open[b.dataset.id]=!open[b.dataset.id];b.nextElementSibling.classList.toggle("open");b.textContent=open[b.dataset.id]?"Ocultar detalle ▴":"Ver detalle ▾"};
render();
function cargar(){try{fetch("predicciones.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.ligas&&j.ligas.length&&j.actualizado!==DATA.actualizado){DATA=j;if(lg>=DATA.ligas.length)lg=0;render()}}).catch(()=>{})}catch(e){}}
cargar();setInterval(cargar,300000);
</script>
</body>
</html>
